name: Deploy Backend

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # AZURE_CLIENT_SECRET อยู่ในไฟล์ .env บน server เท่านั้น (ไม่อยู่ใน git / GitHub) — docker compose อ่านเองตอน up
      # git rm --cached .env: ให้ git บน server เลิกยุ่งกับ .env (ไฟล์ยังอยู่) — pull ไม่ทับ/ไม่ลบ secret แม้ commit ยังมี .env
      #   ถ้า .env ไม่อยู่ใน git แล้ว คำสั่งนี้ไม่ทำอะไร
      - name: Deploy
        run: |
          echo "${{ secrets.ROOT_PASSWORD }}" | su -c "
            docker network create cem_network 2>/dev/null || true &&
            cd /var/www/html/backend_cem &&
            git checkout docker-compose.yml &&
            (git rm -q --cached .env 2>/dev/null || true) &&
            git pull origin develop &&
            docker compose up -d --build --remove-orphans
          " root
